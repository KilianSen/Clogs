version: '3.8'

services:
  agent:
    image: ghcr.io/kiliansen/clogs-agent:${AGENTS_VERSION:-latest}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CLOGS_BACKEND_URL=http://server:8000
    networks:
      - clogs-network
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  server:
    image: ghcr.io/kiliansen/clogs-server:${BACKEND_VERSION:-latest}
    ports:
      - "8000:8000"
    networks:
      - clogs-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  web:
    image: ghcr.io/kiliansen/clogs-web:${FRONTEND_VERSION:-latest}
    ports:
      - "8080:5173"
    environment:
      - CLOGS_BACKEND_URL=http://server:8000
    networks:
      - clogs-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

networks:
  clogs-network:
    driver: overlay
